<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ site.Home.RelPermalink }}">SpiderMedia.ru <span>архив</span></a>
    <nav>
      {{ range site.Sections.ByWeight }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site">
    Архивная копия <a href="{{ site.Params.sourceSite }}">spidermedia.ru</a>, восстановленная из
    <a href="https://web.archive.org/web/*/spidermedia.ru">Wayback Machine</a>.
    Изображения и аудио загружаются из архива.
  </footer>
</body>
</html>
